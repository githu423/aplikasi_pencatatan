name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Pasang Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Pasang Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Buat folder android jika belum ada
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --project-name catatan_keuangan
          fi

      - name: Siapkan Android (FlutterFragmentActivity + minSdk 21)
        run: |
          set -euo pipefail

          # local_auth membutuhkan FlutterFragmentActivity, bukan FlutterActivity
          while IFS= read -r -d '' activity; do
            echo "Menambal $activity agar memakai FlutterFragmentActivity"
            sed -i 's/FlutterActivity/FlutterFragmentActivity/g' "$activity"
          done < <(find android -name "MainActivity.kt" -print0 2>/dev/null || true)

          if ! find android -name "MainActivity.kt" | grep -q .; then
            echo "MainActivity.kt tidak ditemukan" >&2
            exit 1
          fi

          # local_auth membutuhkan minSdkVersion minimal 21
          while IFS= read -r -d '' gradle_file; do
            sed -i \
              -e 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' \
              -e 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' \
              -e 's/minSdkVersion [0-9]\+/minSdkVersion 21/g' \
              -e 's/minSdk = [0-9]\+/minSdk = 21/g' \
              "$gradle_file"
            echo "Menyetel minSdk 21 di $gradle_file"
          done < <(find android -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) -print0)

      - name: Ambil dependensi
        run: flutter pub get

      - name: Bangun APK
        run: |
          set -o pipefail
          flutter --version
          flutter build apk --release --no-tree-shake-icons 2>&1 | tee apk-build.log

      - name: Laporkan error build
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Build APK gagal"
            echo
            echo "Flutter:"
            flutter --version || true
            echo
            echo '```'
            if [ -f apk-build.log ]; then
              tail -c 50000 apk-build.log
            else
              echo "apk-build.log tidak ada"
            fi
            echo
            echo '```'
          } > /tmp/fail-comment.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@/tmp/fail-comment.md
          # Anotasi ringkas agar terbaca lewat Check Runs API
          {
            echo "::error title=Flutter build gagal::"
            if [ -f apk-build.log ]; then
              grep -E "Error:|error:|FAILURE|FAILED|Unhandled|Exception|NoSuchMethod|undefined|isn't defined|Error:" apk-build.log | tail -n 40
            fi
          }

      - name: Simpan APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: catatan-keuangan-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Terbitkan APK di Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Catatan Keuangan v${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
